<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Driving Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">Tracks</div>
        <button id="btn-original" class="track-btn" onclick="switchTrack('original')">Short Loop</button>
        <button id="btn-rbr" class="track-btn" onclick="switchTrack('rbr')">Red Bull Ring</button>
        <button id="btn-spa" class="track-btn active" onclick="switchTrack('spa')">Spa-Francorchamps</button>
        
        <div class="controls-hint">
            Controls: <br><br>
            <strong>ARROW KEYS</strong> or <strong>WASD</strong><br><br>
            <strong>R</strong> to Reset Car<br><br>
        </div>
    </div>

    <div class="main-content">
        <div class="top-dashboard">
            <div class="dash-panel speed-panel">
                <div class="panel-lbl">SPEED (KM/H)</div>
                <div class="panel-val" id="liveSpeed">0</div>
            </div>
            <div class="dash-panel" id="sec1Box">
                <div class="panel-lbl">Sector 1</div>
                <div class="panel-val" id="s1Time">--.---</div>
                <div class="panel-sub">PB: <span id="s1Best">--.---</span></div>
            </div>
            <div class="dash-panel" id="sec2Box">
                <div class="panel-lbl">Sector 2</div>
                <div class="panel-val" id="s2Time">--.---</div>
                <div class="panel-sub">PB: <span id="s2Best">--.---</span></div>
            </div>
            <div class="dash-panel" id="sec3Box">
                <div class="panel-lbl">Sector 3</div>
                <div class="panel-val" id="s3Time">--.---</div>
                <div class="panel-sub">PB: <span id="s3Best">--.---</span></div>
            </div>
            <div class="dash-panel lap-panel">
                <div class="panel-lbl">CURRENT LAP</div>
                <div class="panel-val" id="tvLapTime">00.000</div>
                <div class="panel-sub">BEST: <span id="lapBest">--.---</span></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="trackCanvas" width="1600" height="900"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
