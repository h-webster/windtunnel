<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Prix Time Trial - Camera Follow</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            box-sizing: border-box;
            height: 100vh;
            overflow: hidden; 
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 270px;
            background: #1a1a1a;
            border-right: 4px solid #ff3333;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .sidebar-title {
            text-align: center;
            font-size: 1.2em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: #aaa;
        }
        .track-btn {
            background: #252525;
            color: #fff;
            border: none;
            padding: 15px 20px;
            text-align: left;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 0px solid #ff3333;
            margin-bottom: 5px;
        }
        .track-btn:hover { background: #333; }
        .track-btn.active {
            background: #ff3333;
            border-left: 8px solid #fff;
            padding-left: 12px;
        }
        .controls-hint {
            margin-top: auto;
            padding: 20px;
            color: #666;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }
        .controls-hint strong { color: #bbb; }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #2b4a2b; 
            position: relative;
        }

        /* --- Top Dashboard --- */
        .top-dashboard {
            display: flex;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 2px solid #111;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-shrink: 0; 
            z-index: 5;
        }
        .dash-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-right: 1px solid #2a2a2a;
            transition: background 0.2s;
        }
        .speed-panel { background: #111; flex: 0.8; border-right: 2px solid #333;}
        .lap-panel { background: #0b0b0b; flex: 1.2; border-left: 2px solid #333;}
        
        .panel-lbl { font-size: 0.75em; color: #888; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        .speed-panel .panel-lbl, .lap-panel .panel-lbl { color: #ff3333; }
        .panel-val { font-family: monospace; font-size: 1.4em; font-weight: bold; color: #fff; }
        .lap-panel .panel-val { font-size: 1.6em; color: #ffff55; }
        .panel-sub { font-family: monospace; font-size: 0.85em; color: #aaa; margin-top: 4px; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }
        .panel-sub span { color: #00ff66; font-weight: bold; }

        .dash-panel.active { background: #282828; }
        .dash-panel.purple { background: #b000d2; }
        .dash-panel.green { background: #00b050; }
        .dash-panel.yellow { background: #e5b100; }
        .dash-panel.purple .panel-lbl, .dash-panel.green .panel-lbl, .dash-panel.yellow .panel-lbl { color: #fff; }

        /* --- Canvas --- */
        .canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        canvas {
            background-color: transparent; 
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: top left; 
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">Track Select</div>
        <button id="btn-original" class="track-btn active" onclick="switchTrack('original')">Track 1: Original Loop</button>
        <button id="btn-canada" class="track-btn" onclick="switchTrack('canada')">Track 2: Circuit Montréal</button>
        
        <div class="controls-hint">
            Controls: <br><br><strong>ARROW KEYS</strong> or <strong>WASD</strong><br><br>Speed up, brake, and steer!
        </div>
    </div>

    <div class="main-content">
        <div class="top-dashboard">
            <div class="dash-panel speed-panel">
                <div class="panel-lbl">SPEED (KM/H)</div>
                <div class="panel-val" id="liveSpeed">0</div>
            </div>
            <div class="dash-panel" id="sec1Box">
                <div class="panel-lbl">Sector 1</div>
                <div class="panel-val" id="s1Time">--.---</div>
                <div class="panel-sub">PB: <span id="s1Best">--.---</span></div>
            </div>
            <div class="dash-panel" id="sec2Box">
                <div class="panel-lbl">Sector 2</div>
                <div class="panel-val" id="s2Time">--.---</div>
                <div class="panel-sub">PB: <span id="s2Best">--.---</span></div>
            </div>
            <div class="dash-panel" id="sec3Box">
                <div class="panel-lbl">Sector 3</div>
                <div class="panel-val" id="s3Time">--.---</div>
                <div class="panel-sub">PB: <span id="s3Best">--.---</span></div>
            </div>
            <div class="dash-panel lap-panel">
                <div class="panel-lbl">CURRENT LAP</div>
                <div class="panel-val" id="tvLapTime">00.000</div>
                <div class="panel-sub">BEST: <span id="lapBest">--.---</span></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="trackCanvas" width="1600" height="950"></canvas>
        </div>
    </div>

    <script>
        const trackCanvas = document.getElementById('trackCanvas');
        const ctxTrack = trackCanvas.getContext('2d');
        const liveSpeedUI = document.getElementById('liveSpeed');

        const sec1Box = document.getElementById('sec1Box');
        const sec2Box = document.getElementById('sec2Box');
        const sec3Box = document.getElementById('sec3Box');
        const s1Time = document.getElementById('s1Time');
        const s2Time = document.getElementById('s2Time');
        const s3Time = document.getElementById('s3Time');
        const tvLapTime = document.getElementById('tvLapTime');
        
        const s1BestUI = document.getElementById('s1Best');
        const s2BestUI = document.getElementById('s2Best');
        const s3BestUI = document.getElementById('s3Best');
        const lapBestUI = document.getElementById('lapBest');

        const trackWidth = 55; // Slightly wider track profile for optimal camera tracking gameplay
        const maxSpeedBase = 325; 
        const maxGripSpeed = 210; 
        const zoomLevel = 2.2;  // Viewport scale configuration (2.2x close zoom)

        // --- 1. Original Short Track Restored (World Coordinates) ---
        const pathOriginal = new Path2D();
        pathOriginal.moveTo(150, 530); 
        pathOriginal.lineTo(550, 530); 
        pathOriginal.lineTo(600, 530);
        pathOriginal.lineTo(620, 490);
        pathOriginal.lineTo(660, 510);
        pathOriginal.bezierCurveTo(780, 540, 880, 410, 820, 310); 
        pathOriginal.bezierCurveTo(760, 210, 920, 150, 880, 80); 
        pathOriginal.lineTo(180, 80); 
        pathOriginal.arc(180, 110, 30, -Math.PI / 2, Math.PI / 2, true); 
        pathOriginal.lineTo(350, 140);
        pathOriginal.bezierCurveTo(500, 140, 650, 100, 600, 250); 
        pathOriginal.quadraticCurveTo(580, 320, 480, 320); 
        pathOriginal.lineTo(430, 320); 
        pathOriginal.lineTo(430, 400); 
        pathOriginal.lineTo(300, 400); 
        pathOriginal.lineTo(260, 400); 
        pathOriginal.bezierCurveTo(260, 240, 120, 240, 120, 420); 
        pathOriginal.lineTo(150, 460); 
        pathOriginal.bezierCurveTo(50, 460, 50, 530, 150, 530);

        // --- 2. UN-COMPRESSED REAL SCALE Circuit Montréal Geometry ---
        const pathCanada = (() => {
            const p = new Path2D();
            p.moveTo(800, 1200);
            p.lineTo(3200, 1200); 
            
            p.bezierCurveTo(3450, 1200, 3600, 1050, 3450, 900);
            p.bezierCurveTo(3350, 800, 3150, 950, 3050, 850);
            
            p.lineTo(2850, 700);
            p.quadraticCurveTo(2750, 650, 2850, 600);
            p.lineTo(3300, 600); 
            
            p.bezierCurveTo(3450, 600, 3500, 500, 3350, 450);
            p.lineTo(2900, 450); 
            
            p.quadraticCurveTo(2750, 450, 2850, 350);
            p.lineTo(4000, 350); 
            
            p.bezierCurveTo(4350, 350, 4450, 200, 4100, 100);
            p.bezierCurveTo(3950, 0, 3700, 100, 3500, 100);
            
            p.lineTo(600, 100);
            
            p.lineTo(400, 350);
            p.lineTo(550, 600);
            
            p.bezierCurveTo(700, 800, 500, 1200, 800, 1200);
            return p;
        })();

        const tracks = {
            original: {
                path: pathOriginal,
                start: { x: 180, y: 530, angle: 0 },
                targets: { s1: 5.2, s2: 6.4, s3: 4.8 },
                pb: { s1: Infinity, s2: Infinity, s3: Infinity, lap: Infinity },
                checkers: {
                    finish: { x: 200, y1: 510, y2: 550, color: '#fff' },
                    s1: { x: 400, y1: 60, y2: 100, color: '#ffff55' },
                    s2: { x: 280, y1: 380, y2: 420, color: '#d155ff' }
                },
                gates: {
                    s1: (x, y, px) => px >= 400 && x < 400 && y < 120,
                    s2: (x, y, px) => px >= 280 && x < 280 && y > 360 && y < 440,
                    finish: (x, y, px) => px <= 200 && x > 200 && y > 490 && y < 570
                }
            },
            canada: {
                path: pathCanada,
                start: { x: 1200, y: 1200, angle: 0 }, 
                targets: { s1: 14.5, s2: 16.2, s3: 11.8 },
                pb: { s1: Infinity, s2: Infinity, s3: Infinity, lap: Infinity },
                checkers: {
                    finish: { x: 1500, y1: 1150, y2: 1250, color: '#fff' },   
                    s1: { x: 3000, y1: 550, y2: 650, color: '#ffff55' },     
                    s2: { x: 2200, y1: 50, y2: 150, color: '#d155ff' }       
                },
                gates: {
                    s1: (x, y, px) => px <= 3000 && x > 3000 && y > 500 && y < 700,
                    s2: (x, y, px) => px >= 2200 && x < 2200 && y > 0 && y < 200,
                    finish: (x, y, px) => px <= 1500 && x > 1500 && y > 1100 && y < 1300
                }
            }
        };

        // --- GLOBAL STATES ---
        let currentTrackId = 'original';
        let currentTrackData = tracks[currentTrackId];
        
        let car = {
            x: 0, y: 0, angle: 0, speed: 0, 
            acceleration: 3.2, friction: 0.988, grassFriction: 0.80, turnSpeed: 0.038
        };

        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        let lapStartTime = 0, sectorStartTime = 0, currentSector = 1, hasCrossedStartLine = false;
        let lastS1 = 0, lastS2 = 0, lastS3 = 0;

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // --- LOCAL STORAGE FUNCTIONS ---
        function savePBs(trackId) {
            const pbData = tracks[trackId].pb;
            localStorage.setItem(`gp_pb_${trackId}`, JSON.stringify(pbData));
        }

        function loadPBs() {
            for (let trackId in tracks) {
                const saved = localStorage.getItem(`gp_pb_${trackId}`);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Ensure we safely copy values, fallback to Infinity if missing
                        tracks[trackId].pb.s1 = parsed.s1 !== undefined ? parsed.s1 : Infinity;
                        tracks[trackId].pb.s2 = parsed.s2 !== undefined ? parsed.s2 : Infinity;
                        tracks[trackId].pb.s3 = parsed.s3 !== undefined ? parsed.s3 : Infinity;
                        tracks[trackId].pb.lap = parsed.lap !== undefined ? parsed.lap : Infinity;
                    } catch (e) {
                        console.error("Error loading saved times for track: " + trackId, e);
                    }
                }
            }
        }

        function switchTrack(trackId) {
            document.querySelectorAll('.track-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + trackId).classList.add('active');

            currentTrackId = trackId;
            currentTrackData = tracks[trackId];
            
            car.x = currentTrackData.start.x;
            car.y = currentTrackData.start.y;
            car.angle = currentTrackData.start.angle;
            car.speed = 0;

            hasCrossedStartLine = false;
            currentSector = 1;
            lapStartTime = 0;
            
            sec1Box.className = "dash-panel"; sec2Box.className = "dash-panel"; sec3Box.className = "dash-panel";
            s1Time.innerText = "--.---"; s2Time.innerText = "--.---"; s3Time.innerText = "--.---"; tvLapTime.innerText = "00.000";

            s1BestUI.innerText = currentTrackData.pb.s1 === Infinity ? "--.---" : currentTrackData.pb.s1.toFixed(3);
            s2BestUI.innerText = currentTrackData.pb.s2 === Infinity ? "--.---" : currentTrackData.pb.s2.toFixed(3);
            s3BestUI.innerText = currentTrackData.pb.s3 === Infinity ? "--.---" : currentTrackData.pb.s3.toFixed(3);
            lapBestUI.innerText = currentTrackData.pb.lap === Infinity ? "--.---" : currentTrackData.pb.lap.toFixed(3);
        }

        function update() {
            if (keys.ArrowUp || keys.KeyW) car.speed += car.acceleration;
            else if (keys.ArrowDown || keys.KeyS) car.speed -= car.acceleration * 2.2; 
            else car.speed *= car.friction; 

            if (car.speed > maxSpeedBase) car.speed = maxSpeedBase;
            if (car.speed < 0) car.speed = 0;

            ctxTrack.lineWidth = trackWidth;
            const onTrack = ctxTrack.isPointInStroke(currentTrackData.path, car.x, car.y);
            if (!onTrack) car.speed *= car.grassFriction; 

            let currentTurnSpeed = car.turnSpeed;
            if (car.speed > maxGripSpeed) {
                const understeerFactor = maxGripSpeed / car.speed;
                currentTurnSpeed *= (understeerFactor * 0.65); 
            }

            if (keys.ArrowLeft || keys.KeyA) car.angle -= currentTurnSpeed;
            if (keys.ArrowRight || keys.KeyD) car.angle += currentTurnSpeed;

            const prevX = car.x;
            const prevY = car.y;

            car.x += Math.cos(car.angle) * (car.speed * 0.015); 
            car.y += Math.sin(car.angle) * (car.speed * 0.015);

            if (hasCrossedStartLine) {
                const totalElapsed = (Date.now() - lapStartTime) / 1000;
                tvLapTime.innerText = totalElapsed.toFixed(3);
                
                const currentSecElapsed = (Date.now() - sectorStartTime) / 1000;
                if (currentSector === 1) s1Time.innerText = currentSecElapsed.toFixed(3);
                if (currentSector === 2) s2Time.innerText = currentSecElapsed.toFixed(3);
                if (currentSector === 3) s3Time.innerText = currentSecElapsed.toFixed(3);
            }

            // --- TIMING GATES LOGIC ---
            if (currentTrackData.gates.s1(car.x, car.y, prevX, prevY)) {
                if (currentSector === 1 && hasCrossedStartLine) {
                    lastS1 = (Date.now() - sectorStartTime) / 1000;
                    s1Time.innerText = lastS1.toFixed(3);
                    
                    if (lastS1 <= currentTrackData.targets.s1) sec1Box.className = "dash-panel purple";
                    else if (lastS1 < currentTrackData.pb.s1) sec1Box.className = "dash-panel green";
                    else sec1Box.className = "dash-panel yellow";
                    
                    if (lastS1 < currentTrackData.pb.s1) {
                        currentTrackData.pb.s1 = lastS1;
                        s1BestUI.innerText = lastS1.toFixed(3);
                        savePBs(currentTrackId); // Persistent Save
                    }
                    currentSector = 2; sectorStartTime = Date.now(); sec2Box.className = "dash-panel active";
                }
            }

            if (currentTrackData.gates.s2(car.x, car.y, prevX, prevY)) {
                if (currentSector === 2 && hasCrossedStartLine) {
                    lastS2 = (Date.now() - sectorStartTime) / 1000;
                    s2Time.innerText = lastS2.toFixed(3);
                    
                    if (lastS2 <= currentTrackData.targets.s2) sec2Box.className = "dash-panel purple";
                    else if (lastS2 < currentTrackData.pb.s2) sec2Box.className = "dash-panel green";
                    else sec2Box.className = "dash-panel yellow";
                    
                    if (lastS2 < currentTrackData.pb.s2) {
                        currentTrackData.pb.s2 = lastS2;
                        s2BestUI.innerText = lastS2.toFixed(3);
                        savePBs(currentTrackId); // Persistent Save
                    }
                    currentSector = 3; sectorStartTime = Date.now(); sec3Box.className = "dash-panel active";
                }
            }

            if (currentTrackData.gates.finish(car.x, car.y, prevX, prevY)) {
                if (!hasCrossedStartLine) {
                    hasCrossedStartLine = true;
                    lapStartTime = Date.now(); sectorStartTime = Date.now(); currentSector = 1;
                    sec1Box.className = "dash-panel active"; sec2Box.className = "dash-panel"; sec3Box.className = "dash-panel";
                    s1Time.innerText = "--.---"; s2Time.innerText = "--.---"; s3Time.innerText = "--.---";
                } else if (currentSector === 3) {
                    lastS3 = (Date.now() - sectorStartTime) / 1000;
                    s3Time.innerText = lastS3.toFixed(3);
                    
                    if (lastS3 <= currentTrackData.targets.s3) sec3Box.className = "dash-panel purple";
                    else if (lastS3 < currentTrackData.pb.s3) sec3Box.className = "dash-panel green";
                    else sec3Box.className = "dash-panel yellow";
                    
                    let pbChanged = false;
                    if (lastS3 < currentTrackData.pb.s3) {
                        currentTrackData.pb.s3 = lastS3; s3BestUI.innerText = lastS3.toFixed(3);
                        pbChanged = true;
                    }

                    const finalLapTime = lastS1 + lastS2 + lastS3;
                    tvLapTime.innerText = finalLapTime.toFixed(3);
                    
                    if (finalLapTime < currentTrackData.pb.lap) {
                        currentTrackData.pb.lap = finalLapTime; lapBestUI.innerText = finalLapTime.toFixed(3);
                        pbChanged = true;
                    }
                    
                    if (pbChanged) {
                        savePBs(currentTrackId); // Persistent Save
                    }
                    
                    currentSector = 1; lapStartTime = Date.now(); sectorStartTime = Date.now();
                    setTimeout(() => {
                        if(currentSector === 1) { 
                            sec1Box.className = "dash-panel active"; sec2Box.className = "dash-panel"; sec3Box.className = "dash-panel";
                            s1Time.innerText = "--.---"; s2Time.innerText = "--.---"; s3Time.innerText = "--.---";
                        }
                    }, 2500); 
                }
            }

            liveSpeedUI.innerText = Math.round(car.speed);
            liveSpeedUI.style.color = (car.speed > maxGripSpeed && (keys.ArrowLeft || keys.KeyA || keys.ArrowRight || keys.KeyD)) ? "#ffff55" : "#ffffff";

            renderViewport();
            requestAnimationFrame(update);
        }

        function renderViewport() {
            ctxTrack.clearRect(0, 0, trackCanvas.width, trackCanvas.height);
            
            ctxTrack.save();
            ctxTrack.translate(trackCanvas.width / 2, trackCanvas.height / 2);
            ctxTrack.scale(zoomLevel, zoomLevel);
            ctxTrack.translate(-car.x, -car.y);

            ctxTrack.strokeStyle = "#444"; ctxTrack.lineCap = "round"; ctxTrack.lineJoin = "round";
            ctxTrack.lineWidth = trackWidth; ctxTrack.stroke(currentTrackData.path);
            ctxTrack.strokeStyle = "#fff"; ctxTrack.lineWidth = trackWidth - 6; ctxTrack.stroke(currentTrackData.path);
            ctxTrack.strokeStyle = "#1e3d1e"; ctxTrack.lineWidth = trackWidth - 10; ctxTrack.stroke(currentTrackData.path);

            ctxTrack.lineWidth = 5; ctxTrack.setLineDash([5, 5]);
            const c = currentTrackData.checkers;
            
            ctxTrack.strokeStyle = c.finish.color; ctxTrack.beginPath(); 
            ctxTrack.moveTo(c.finish.x, c.finish.y1); ctxTrack.lineTo(c.finish.x, c.finish.y2);
            ctxTrack.stroke();

            ctxTrack.strokeStyle = c.s1.color; ctxTrack.beginPath(); 
            ctxTrack.moveTo(c.s1.x, c.s1.y1); ctxTrack.lineTo(c.s1.x, c.s1.y2);
            ctxTrack.stroke();

            ctxTrack.strokeStyle = c.s2.color; ctxTrack.beginPath(); 
            ctxTrack.moveTo(c.s2.x, c.s2.y1); ctxTrack.lineTo(c.s2.x, c.s2.y2);
            ctxTrack.stroke();
            
            ctxTrack.setLineDash([]); 

            ctxTrack.save();
            ctxTrack.translate(car.x, car.y); 
            ctxTrack.rotate(car.angle);
            
            ctxTrack.fillStyle = "#ff2222"; ctxTrack.fillRect(-8, -4, 16, 8); 
            ctxTrack.fillStyle = "#111111"; ctxTrack.fillRect(2, -5, 3, 10);   
            ctxTrack.fillStyle = "#111111"; ctxTrack.fillRect(-9, -5, 3, 10);  
            ctxTrack.fillStyle = "#ffffff"; ctxTrack.fillRect(4, -1.5, 3, 3);   
            ctxTrack.fillStyle = "#ffff00"; ctxTrack.fillRect(-1, -1, 2, 2);    
            
            ctxTrack.restore(); 
            ctxTrack.restore(); 
        }

        // Initialize saved data before rendering anything
        loadPBs(); 
        switchTrack('original'); 
        update();
    </script>
</body>
</html>
